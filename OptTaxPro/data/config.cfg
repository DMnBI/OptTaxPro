[DEFAULT]
--log = PRJNA933120.log
--processes = 40
--suffix = .fastq
--t_dir = PRJNA933120
--o_dir = PRJNA933120
--i_dir = examples/PRJNA933120

[PREPROCESS]
--min-len = 1300
--max-len = 1850
-O = 15
-e = 0.15

--qc-cutoff = 0.99

--single-cutoff = 0.97
--single-threads = 10

[CLUSTER]
--otu-cutoff = 0.99
--otu-threads = 10

[CLASSIFY]
--search-threads = 10
--search-cutoffs = [0.94, 0.86, 0.75]

--ranks = ['species', 'HSG', 'genus', 'family', 'order', 'class', 'phylum']
--assign-cutoffs = [97, 97, 94, 86, 82, 78, 75]
--add-name = True

[PROFILE]
--profile-ranks = ['species', 'genus', 'family']
--base-col = scientific_name
--filtering-cutoffs = [0, 0.01, 0.05]
--filtering-pivot = max
--output-prefix = PRJNA933120